<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary meta -->
    <title>Arc ERC-8004 Explorer</title>
    <meta name="description" content="Find and inspect ERC-8004 agents on Arc Mainnet and Arc Testnet. Search agent IDs, owners, wallets, metadata, reputation, and validation data." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.arcagents.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.arcagents.app/" />
    <meta property="og:title" content="Arc ERC-8004 Explorer" />
    <meta property="og:description" content="Arc ERC-8004 Explorer is a read-only public explorer and API for resolving ERC-8004 agent identities, metadata, reputation, and validation data on Arc Mainnet and Arc Testnet." />
    <meta property="og:site_name" content="Arc ERC-8004 Explorer" />
    <meta property="og:image" content="https://www.arcagents.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arc ERC-8004 Explorer — find and inspect ERC-8004 agents on Arc" />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arc ERC-8004 Explorer" />
    <meta name="twitter:description" content="Arc ERC-8004 Explorer is a read-only public explorer and API for resolving ERC-8004 agent identities, metadata, reputation, and validation data on Arc Mainnet and Arc Testnet." />
    <meta name="twitter:image" content="https://www.arcagents.app/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.arcagents.app/#website",
          "url": "https://www.arcagents.app/",
          "name": "Arc ERC-8004 Explorer",
          "description": "Arc ERC-8004 Explorer is a read-only public explorer and API for resolving ERC-8004 agent identities, metadata, reputation, and validation data on Arc Mainnet and Arc Testnet."
        },
        {
          "@type": "WebApplication",
          "@id": "https://www.arcagents.app/#app",
          "url": "https://www.arcagents.app/",
          "name": "Arc ERC-8004 Explorer",
          "description": "Arc ERC-8004 Explorer is a read-only public explorer and API for resolving ERC-8004 agent identities, metadata, reputation, and validation data on Arc Mainnet and Arc Testnet.",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Any"
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
